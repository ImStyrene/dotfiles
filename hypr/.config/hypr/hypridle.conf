general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 90
    on-timeout = notify-send "Hypridle" "You are currently in idle mode! 60 seconds left before lock screen."
    on-resume = notify-send "Hypridle" "Your timer has resumed."
}

